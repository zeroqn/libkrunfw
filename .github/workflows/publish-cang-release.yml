name: Publish cang prebuilt binaries

on:
  push:
    branches:
      - cang
    tags:
      - "v[0-9]*-cang.*"

permissions:
  contents: write

concurrency:
  group: cang-prebuilt-releases
  cancel-in-progress: false

env:
  RELEASE_PREFIX: cang

jobs:
  build-x86_64:
    name: Build x86_64 prebuilt package
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      - name: Build x86_64 package
        run: |
          set -euo pipefail
          make
          make PREFIX=tmp LIBDIR_Linux=lib64 install
          cd tmp
          tar czf ../libkrunfw-x86_64.tgz lib64
          cd ..
          make clean
        shell: bash

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload x86_64 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-x86_64
          path: libkrunfw-x86_64.tgz
          if-no-files-found: error

  build-aarch64:
    name: Build aarch64 prebuilt package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      - name: Build aarch64 package
        run: |
          set -euo pipefail
          make
          make PREFIX=tmp LIBDIR_Linux=lib64 install
          cd tmp
          tar czf ../libkrunfw-aarch64.tgz lib64
          cd ..
          make clean
        shell: bash

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload aarch64 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-aarch64
          path: libkrunfw-aarch64.tgz
          if-no-files-found: error

  build-riscv64:
    name: Build riscv64 prebuilt package
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev gcc-riscv64-linux-gnu

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      - name: Build riscv64 package
        run: |
          set -euo pipefail
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu-
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- PREFIX=tmp LIBDIR_Linux=lib64 install
          cd tmp
          tar czf ../libkrunfw-riscv64.tgz lib64
          cd ..
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- clean
        shell: bash

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload riscv64 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-riscv64
          path: libkrunfw-riscv64.tgz
          if-no-files-found: error

  build-x86_64-lto:
    name: Build x86_64 LTO prebuilt packages
    uses: ./.github/workflows/build-x86_64-lto.yml

  publish-release:
    name: Publish cang prerelease
    runs-on: ubuntu-latest
    needs:
      - build-x86_64
      - build-x86_64-lto
      - build-aarch64
      - build-riscv64
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A pushed v<version>-cang.<n> tag publishes a permanent,
            # version-addressed release: the tag is the release identity and
            # already pins the commit, so no --target is needed. `cang-<sha>`
            # releases stay rolling dev artifacts that the prune job below
            # deletes; its filter only matches `cang-`, so permanent releases
            # are never pruned.
            version="${GITHUB_REF_NAME#v}"
            full_version="$(sed -n 's/^FULL_VERSION = \(.*\)$/\1/p' Makefile)"
            if [ -z "${full_version}" ]; then
              echo "failed to read FULL_VERSION from Makefile" >&2
              exit 1
            fi
            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-cang\.[0-9]+$'; then
              echo "tag must look like v<major>.<minor>.<patch>-cang.<n>: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            case "${version}" in
              "${full_version}-cang."*) ;;
              *)
                echo "tag ${GITHUB_REF_NAME} does not match this branch's libkrunfw ${full_version}" >&2
                exit 1
                ;;
            esac
            {
              echo "tag_name=${GITHUB_REF_NAME}"
              echo "release_title=libkrunfw ${GITHUB_REF_NAME}"
              echo "permanent=true"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "tag_name=${RELEASE_PREFIX}-${short_sha}"
              echo "release_title=cang ${short_sha}"
              echo "permanent=false"
            } >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

      - name: Download prebuilt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libkrunfw-*
          path: dist
          merge-multiple: true

      - name: Attest prebuilt artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tgz"

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          PERMANENT: ${{ steps.release.outputs.permanent }}
        run: |
          set -euo pipefail

          test -f dist/libkrunfw-x86_64.tgz
          test -f dist/libkrunfw-x86_64-lto.tgz
          test -f dist/libkrunfw-x86_64-kvm-lto.tgz
          test -f dist/libkrunfw-aarch64.tgz
          test -f dist/libkrunfw-riscv64.tgz

          notes="Prebuilt libkrunfw artifacts for cang commit ${GITHUB_SHA}. Source is available from the release tag archive."

          if [ "${PERMANENT}" = "true" ]; then
            # The pushed tag already pins the commit, so a re-run of a green or
            # half-finished release just refreshes its assets.
            if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release create "${TAG_NAME}" \
                --title "${RELEASE_TITLE}" \
                --notes "${notes}" \
                --prerelease
            fi
          else
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release delete "${TAG_NAME}" --yes --cleanup-tag
            fi
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes "${notes}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" dist/*.tgz --clobber
        shell: bash

  prune-old-cang-releases:
    name: Keep latest 10 cang prereleases
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Delete older cang releases and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | map(select(.tagName | startswith("cang-"))) | .[10:][]?.tagName' |
          while IFS= read -r tag_name; do
            [ -n "${tag_name}" ] || continue
            echo "Deleting old cang release ${tag_name}"
            gh release delete "${tag_name}" --yes --cleanup-tag
          done
        shell: bash
