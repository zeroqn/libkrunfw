name: Publish cang prebuilt binaries

on:
  push:
    branches:
      # `cang` bundles the newest kernel line, `cang-lts` the LTS line. Both
      # publish permanent v<version>-cang.<n> / v<version>-cang-lts.<n>
      # releases, and each gets its own rolling <prefix>-<sha> prereleases.
      - cang
      - cang-lts
    tags:
      - "v[0-9]*-cang.*"
      - "v[0-9]*-cang-lts.*"

permissions:
  contents: write

concurrency:
  # Scoped per ref so a tag-triggered permanent release never queues behind an
  # in-flight branch build (the x86_64 LTO kernel job alone is ~30 minutes).
  # Pushes to the same ref still serialize.
  group: cang-prebuilt-releases-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-x86_64:
    name: Build x86_64 prebuilt package
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      - name: Build x86_64 package
        run: |
          set -euo pipefail
          make
          make PREFIX=tmp LIBDIR_Linux=lib64 install
          cd tmp
          tar czf ../libkrunfw-x86_64.tgz lib64
          cd ..
          make clean
        shell: bash

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload x86_64 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-x86_64
          path: libkrunfw-x86_64.tgz
          if-no-files-found: error

  build-aarch64:
    name: Build aarch64 prebuilt package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check release scope
        id: scope
        run: |
          if grep -qx aarch64 release-arches; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "aarch64 is not in release-arches for this branch; no aarch64 asset is published" >&2
          fi

      - name: Code checkout
        if: steps.scope.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install dependencies
        if: steps.scope.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev

      - name: Set up ccache
        if: steps.scope.outputs.ready == 'true'
        uses: ./.github/actions/setup-ccache

      - name: Build aarch64 package
        if: steps.scope.outputs.ready == 'true'
        run: |
          set -euo pipefail
          make
          make PREFIX=tmp LIBDIR_Linux=lib64 install
          cd tmp
          tar czf ../libkrunfw-aarch64.tgz lib64
          cd ..
        shell: bash

      - name: Show ccache stats
        if: steps.scope.outputs.ready == 'true'
        run: ccache -s

      - name: Upload aarch64 workflow artifact
        if: steps.scope.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-aarch64
          path: libkrunfw-aarch64.tgz
          if-no-files-found: error

  build-riscv64:
    name: Build riscv64 prebuilt package
    runs-on: ubuntu-latest
    steps:
      - name: Check release scope
        id: scope
        run: |
          if grep -qx riscv64 release-arches; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "riscv64 is not in release-arches for this branch; no riscv64 asset is published" >&2
          fi

      - name: Code checkout
        if: steps.scope.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install dependencies
        if: steps.scope.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev gcc-riscv64-linux-gnu

      - name: Set up ccache
        if: steps.scope.outputs.ready == 'true'
        uses: ./.github/actions/setup-ccache

      - name: Build riscv64 package
        if: steps.scope.outputs.ready == 'true'
        run: |
          set -euo pipefail
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu-
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- PREFIX=tmp LIBDIR_Linux=lib64 install
          cd tmp
          tar czf ../libkrunfw-riscv64.tgz lib64
          cd ..
        shell: bash

      - name: Show ccache stats
        if: steps.scope.outputs.ready == 'true'
        run: ccache -s

      - name: Upload riscv64 workflow artifact
        if: steps.scope.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-riscv64
          path: libkrunfw-riscv64.tgz
          if-no-files-found: error

  build-x86_64-lto:
    name: Build x86_64 LTO prebuilt packages
    uses: ./.github/workflows/build-x86_64-lto.yml

  publish-release:
    name: Publish cang prerelease
    runs-on: ubuntu-latest
    needs:
      - build-x86_64
      - build-x86_64-lto
      - build-aarch64
      - build-riscv64
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A pushed v<version>-cang.<n> / v<version>-cang-lts.<n> tag publishes
            # a permanent, version-addressed release: the tag is the release
            # identity and already pins the commit, so no --target is needed.
            # Rolling <prefix>-<sha> releases stay dev artifacts that the prune
            # job below deletes; its filter only matches those, so permanent
            # releases are never pruned.
            version="${GITHUB_REF_NAME#v}"
            full_version="$(sed -n 's/^FULL_VERSION = \(.*\)$/\1/p' Makefile)"
            if [ -z "${full_version}" ]; then
              echo "failed to read FULL_VERSION from Makefile" >&2
              exit 1
            fi
            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-cang(-lts)?\.[0-9]+$'; then
              echo "tag must look like v<major>.<minor>.<patch>-cang.<n> or v<major>.<minor>.<patch>-cang-lts.<n>: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            case "${version}" in
              "${full_version}-cang."*|"${full_version}-cang-lts."*) ;;
              *)
                echo "tag ${GITHUB_REF_NAME} does not match this branch's libkrunfw ${full_version}" >&2
                exit 1
                ;;
            esac
            {
              echo "tag_name=${GITHUB_REF_NAME}"
              echo "release_title=libkrunfw ${GITHUB_REF_NAME}"
              echo "permanent=true"
            } >> "${GITHUB_OUTPUT}"
          else
            # The LTS branch gets its own rolling prefix so the two lines never
            # shadow each other's dev releases.
            if [ "${GITHUB_REF_NAME}" = "cang-lts" ]; then
              prefix="cang-lts"
            else
              prefix="cang"
            fi
            {
              echo "tag_name=${prefix}-${short_sha}"
              echo "release_title=${prefix} ${short_sha}"
              echo "permanent=false"
            } >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

      - name: Download prebuilt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libkrunfw-*
          path: dist
          merge-multiple: true

      - name: Attest prebuilt artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tgz"

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          PERMANENT: ${{ steps.release.outputs.permanent }}
        run: |
          set -euo pipefail

          # x86_64 is built for every line; the other arches only for a branch
          # that lists them in release-arches (its kernel config is refreshed
          # for this line's KERNEL_VERSION and the build is verified).
          expected="dist/libkrunfw-x86_64.tgz dist/libkrunfw-x86_64-lto.tgz dist/libkrunfw-x86_64-kvm-lto.tgz"
          if grep -qx aarch64 release-arches; then
            expected="${expected} dist/libkrunfw-aarch64.tgz"
          fi
          if grep -qx riscv64 release-arches; then
            expected="${expected} dist/libkrunfw-riscv64.tgz"
          fi
          for asset in ${expected}; do
            test -f "${asset}" || { echo "missing expected asset ${asset}" >&2; exit 1; }
          done
          echo "assets (release-arches: $(tr '\n' ' ' < release-arches)):"
          ls -l dist/*.tgz

          notes="Prebuilt libkrunfw artifacts for cang commit ${GITHUB_SHA}. Source is available from the release tag archive."

          if [ "${PERMANENT}" = "true" ]; then
            # The pushed tag already pins the commit, so a re-run of a green or
            # half-finished release just refreshes its assets.
            if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release create "${TAG_NAME}" \
                --title "${RELEASE_TITLE}" \
                --notes "${notes}" \
                --prerelease
            fi
          else
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release delete "${TAG_NAME}" --yes --cleanup-tag
            fi
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes "${notes}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" dist/*.tgz --clobber
        shell: bash

  prune-old-cang-releases:
    name: Keep latest 10 cang prereleases per line
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Delete older cang releases and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # One list per rolling prefix: `cang-<sha>` and `cang-lts-<sha>`.
          # Permanent v<version>-cang(-lts).<n> releases never match.
          for prefix in cang cang-lts; do
            gh release list --limit 100 --json tagName,createdAt \
              --jq "sort_by(.createdAt) | reverse | map(select(.tagName | test(\"^${prefix}-[0-9a-f]{12}$\"))) | .[10:][]?.tagName" |
            while IFS= read -r tag_name; do
              [ -n "${tag_name}" ] || continue
              echo "Deleting old ${prefix} release ${tag_name}"
              gh release delete "${tag_name}" --yes --cleanup-tag
            done
          done
        shell: bash
